<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hoo Did It?</title>
<meta name="theme-color" content="#1b1b2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoo Did It">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b2f;--sky:#5ec8ff;--grass:#3ddc6a;--grassD:#1f9a45;--gold:#ffcc2e;--goldD:#d99a00;--red:#ff5a5a;--redD:#c22f2f;--purple:#8b5cff;--purpleD:#5b2fd1;--pink:#ff5fae;--pinkD:#c92f7c;--blue:#2fa8ff;--blueD:#0f6fc0;--orange:#ff8a2a;--orangeD:#c95a00;--card:#fff;--muted:#5c6080}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);min-height:100vh;display:flex;justify-content:center;
 background:#4dbdf5;background-image:linear-gradient(rgba(255,255,255,.12) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.12) 2px,transparent 2px);background-size:36px 36px;animation:scroll 12s linear infinite}
@keyframes scroll{to{background-position:36px 36px}}
.app{width:100%;max-width:440px;min-height:100vh;position:relative;padding-bottom:104px}
.H{font-family:'Lilita One',sans-serif;letter-spacing:.5px}
.proto{background:var(--ink);color:#ffe9a8;font-size:12px;text-align:center;padding:4px;font-weight:600}

/* chunky blocks */
.blk{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink)}
.btn{font-family:'Lilita One',sans-serif;font-size:20px;letter-spacing:.5px;color:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 18px;cursor:pointer;
 background:var(--grass);box-shadow:inset 0 -6px 0 var(--grassD),0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:inset 0 -3px 0 var(--grassD),0 0 0 var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink);text-shadow:none;box-shadow:inset 0 -6px 0 var(--goldD),0 5px 0 var(--ink)}
.btn.red{background:var(--red);box-shadow:inset 0 -6px 0 var(--redD),0 5px 0 var(--ink)}
.btn.blue{background:var(--blue);box-shadow:inset 0 -6px 0 var(--blueD),0 5px 0 var(--ink)}
.btn.grey{background:#d9dcef;color:var(--ink);text-shadow:none;box-shadow:inset 0 -6px 0 #aab0d4,0 5px 0 var(--ink)}
.btn.sm{font-size:16px;padding:7px 12px;border-radius:13px}
.btn.full{width:100%;font-size:24px;padding:14px}
.btn:disabled{filter:grayscale(.8);opacity:.6}

/* header */
header{padding:16px 16px 10px}
.top{display:flex;align-items:center;gap:12px;padding:12px;}
.top .nm{flex:1}
.top .nm .H{font-size:26px;line-height:1}
.badge{display:inline-block;margin-top:4px;font-weight:700;font-size:13px;background:var(--ink);color:#fff;border-radius:10px;padding:2px 9px}
.sw{background:#eef0ff;border:3px solid var(--ink);border-radius:12px;font:inherit;font-weight:700;font-size:13px;padding:5px 9px;cursor:pointer}
.chips{display:flex;gap:10px;margin-top:12px}
.chip{flex:1;text-align:center;padding:8px 4px}
.chip .H{font-size:26px;display:block;line-height:1.1}
.chip small{font-weight:700;font-size:12px;color:var(--muted)}
.chip.f{background:var(--gold)}
.chip.s{background:#ffd9c9}
.xp{margin-top:12px;padding:10px 12px}
.xp .row{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.bar{height:22px;background:#e3e6f7;border:3px solid var(--ink);border-radius:12px;margin-top:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--grass) 0 14px,#57ea83 14px 28px);transition:width .6s cubic-bezier(.3,1.6,.5,1);animation:stripes 1s linear infinite;background-size:40px 40px}
@keyframes stripes{to{background-position:40px 0}}

main{padding:4px 16px}
.banner{display:inline-block;font-family:'Lilita One';font-size:20px;color:#fff;background:var(--purple);border:3px solid var(--ink);border-radius:14px;padding:4px 14px;margin:18px 0 10px;box-shadow:0 4px 0 var(--ink);transform:rotate(-2deg);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.tip{background:#fff7cf;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:600;font-size:14px;margin-bottom:10px;box-shadow:0 4px 0 var(--ink)}

/* habit tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:center;padding:12px 8px 12px;cursor:pointer;transition:transform .1s}
.tile:active{transform:scale(.94)}
.tile .em{font-size:52px;line-height:1.1;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.tile .H{font-size:17px;line-height:1.1;margin-top:4px;display:block}
.tile small{font-size:12px;color:var(--muted);font-weight:600;display:block;line-height:1.15;margin-top:2px}
.tile.on{background:#c9ffd9}
.tile.on .em{animation:wiggle 1.6s ease-in-out infinite}
.tile .tick{position:absolute;top:-10px;right:-8px;width:36px;height:36px;border-radius:10px;background:var(--grass);border:3px solid var(--ink);color:#fff;font-family:'Lilita One';font-size:22px;display:flex;align-items:center;justify-content:center;transform:scale(0) rotate(-30deg);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.tile.on .tick{transform:scale(1) rotate(8deg)}
.tile .fe{position:absolute;top:8px;left:10px;font-weight:700;font-size:12px;background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0 5px}
.tile.on .fe{display:none}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}

/* mission cards */
.mis{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:14px}
.mis .em{font-size:48px;width:60px;text-align:center}
.mis .tx{flex:1;min-width:0}
.mis .tx .H{font-size:19px;line-height:1.1;display:block}
.mis .tx small{font-weight:600;color:var(--muted);font-size:13px}
.price{display:inline-block;font-family:'Lilita One';font-size:16px;background:var(--gold);border:2px solid var(--ink);border-radius:9px;padding:0 7px;margin-top:3px}
.dots{margin-top:5px;display:flex;gap:4px}
.dots i{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink);background:#e3e6f7}
.dots i.on{background:var(--grass)}
.tag{font-family:'Lilita One';font-size:14px;border:2px solid var(--ink);border-radius:10px;padding:3px 8px;white-space:nowrap;background:#fff0b3}
.tag.ok{background:#c9ffd9}
.hot{display:inline-block;font-family:'Lilita One';font-size:13px;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 6px;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:11px;border:3px solid var(--ink);background:#fff;font-family:'Lilita One';font-size:22px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.stepper button:active{transform:translateY(3px);box-shadow:none}
.stepper b{font-family:'Lilita One';font-size:20px;min-width:46px;text-align:center}
input[type=text]{width:100%;padding:12px;border-radius:14px;border:3px solid var(--ink);font:inherit;font-size:17px;font-weight:600;margin:4px 0 10px;user-select:text}
.empty{text-align:center;font-family:'Lilita One';font-size:22px;color:#fff;padding:30px;text-shadow:0 3px 0 var(--ink)}

/* nav */
nav{position:fixed;bottom:10px;width:calc(100% - 20px);max-width:420px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:var(--ink);border-radius:22px;z-index:5;margin-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:16px;background:transparent;color:#c9cbe6;font-family:'Lilita One';font-size:13px;display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;cursor:pointer;position:relative}
nav button span{font-size:32px;line-height:1.1;transition:transform .2s}
nav button.on{background:var(--gold);color:var(--ink)}
nav button.on span{transform:scale(1.18) rotate(-6deg)}
nav .dot{position:absolute;top:-6px;right:8px;background:var(--red);color:#fff;font-size:13px;border:2px solid #fff;border-radius:10px;padding:0 6px;animation:pulse 1s infinite}

/* home */
.logo{text-align:center;padding:calc(30px + env(safe-area-inset-top)) 10px 6px}
.logo .H{font-size:54px;line-height:.95;color:var(--gold);-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo p{font-weight:700;color:#fff;font-size:17px;margin-top:10px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.who{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.who button{border:3px solid var(--ink);border-radius:22px;padding:14px 6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;box-shadow:0 7px 0 var(--ink);animation:bob 3s ease-in-out infinite}
.who button:nth-child(2){animation-delay:.4s}.who button:nth-child(3){animation-delay:.8s}.who button:nth-child(4){animation-delay:1.2s}
.who button:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.who .H{font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.who small{font-weight:700;font-size:13px}

/* owl avatar */
.ico{display:inline-block;vertical-align:middle;overflow:visible}
.tile .em .ico{width:64px;height:64px}
.banner .ico,.H .ico{vertical-align:-6px}
.owl .pupil{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bounce{animation:bob 2s ease-in-out infinite}

/* float +1 */
.float{position:fixed;font-family:'Lilita One';font-size:30px;color:var(--gold);-webkit-text-stroke:2px var(--ink);pointer-events:none;z-index:30;animation:floatup 1s ease-out forwards}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:1}100%{transform:translate(-50%,-90px) scale(1.4);opacity:0}}

/* celebration */
.cel{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(27,27,47,.75);animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.rays{position:absolute;width:640px;height:640px;background:repeating-conic-gradient(rgba(255,214,46,.35) 0 12deg,transparent 12deg 24deg);border-radius:50%;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cbox{position:relative;text-align:center;width:86%;max-width:360px;animation:zoom .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes zoom{0%{transform:scale(.2) rotate(-12deg)}100%{transform:scale(1)}}
.cbox .big{font-size:120px;line-height:1;display:inline-block;animation:jump .8s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-26px) scale(.95,1.05)}60%{transform:translateY(0) scale(1.08,.92)}}
.cbox .H.t{font-size:46px;color:var(--gold);-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);line-height:1;margin-top:10px}
.cbox .sub{color:#fff;font-weight:700;font-size:20px;margin-top:8px}
.cbox .gain{display:inline-block;margin-top:12px;font-family:'Lilita One';font-size:34px;background:var(--gold);border:3px solid var(--ink);border-radius:16px;padding:2px 16px;box-shadow:0 5px 0 var(--ink);animation:pulse .8s infinite}
.cbox .btn{margin-top:22px}
.conf{position:fixed;top:-20px;width:12px;height:16px;border:2px solid var(--ink);z-index:41;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(27,27,47,.7);display:flex;align-items:center;justify-content:center;z-index:20}
.modal .blk{padding:20px;width:86%;max-width:340px;text-align:center;animation:zoom .35s cubic-bezier(.3,1.7,.5,1)}
.pin{display:flex;justify-content:center;gap:12px;margin:14px 0}
.pin i{width:22px;height:22px;border-radius:7px;border:3px solid var(--ink)}
.pin i.f{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{padding:12px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-family:'Lilita One';font-size:24px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.pad button:active{transform:translateY(4px);box-shadow:none}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-140px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;font-family:'Lilita One';font-size:18px;transition:transform .35s cubic-bezier(.3,1.6,.5,1);z-index:50;max-width:90%;text-align:center;border:3px solid #fff}
.toast.show{transform:translateX(-50%) translateY(0)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.chips .chip .H{font-size:24px}
.chip.r{background:#f1e4ff}
.mis.duo{background:linear-gradient(135deg,#fff7d1,#ffe3f2)}
.dtag{display:inline-flex;align-items:center;gap:3px;font-family:'Lilita One';font-size:13px;background:var(--ink);color:var(--gold);border-radius:8px;padding:1px 8px;margin-bottom:3px}
.slots{display:flex;align-items:center;gap:6px;margin:6px 0 2px}
.slot{width:52px;height:52px;border:3px dashed #9aa0c8;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff}
.slot span{font-family:'Lilita One';font-size:24px;color:#9aa0c8}
.slot.in{border:3px solid var(--ink);background:#c9ffd9}
.slot i{position:absolute;right:-8px;bottom:-8px;background:var(--grass);color:#fff;border:2px solid var(--ink);border-radius:8px;font-style:normal;font-family:'Lilita One';font-size:14px;padding:0 5px}
.plus{font-family:'Lilita One';font-size:22px}
.segs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.seg{border:3px solid var(--ink);background:#fff;border-radius:12px;font-family:'Lilita One';font-size:14px;padding:5px 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.seg.on{background:var(--gold)}
.seg.big{flex:1;justify-content:center;font-size:20px;padding:10px}
.seg:active{transform:translateY(3px);box-shadow:none}
.chart .ax{font-family:'Lilita One';font-size:11px;fill:#5c6080}
.chart .lv{font-family:'Lilita One';font-size:12px;fill:#1b1b2f}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pt{opacity:0;animation:ptin .35s cubic-bezier(.3,1.8,.5,1) forwards;transform-box:fill-box;transform-origin:center}
@keyframes ptin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-weight:600;font-size:14px;margin-top:4px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);margin-right:5px;vertical-align:-2px}
.studio{padding:14px;text-align:center}
.stage{padding-top:10px;background:radial-gradient(circle at 50% 50%,#fff3c4 0 38%,transparent 39%)}
.ped{width:150px;height:22px;margin:-12px auto 10px;background:#d9dcef;border:3px solid var(--ink);border-radius:50%}
.studio .seg{font-size:13px;padding:5px 8px}
.rbal{font-weight:700;font-size:17px;margin-bottom:10px}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.item{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 2px 8px;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Fredoka';color:var(--ink)}
.item b{font-family:'Lilita One';font-size:13px;font-weight:400}
.item.wear{background:#c9ffd9}
.item:active{transform:translateY(4px);box-shadow:none}
.item .tag,.item .price{font-size:12px;padding:0 6px;margin:0}
.icpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.icpick button{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:4px;cursor:pointer}
.icpick button.on{background:var(--gold);transform:scale(1.06)}
.cbox .big.duo{animation:none;display:flex;justify-content:center;gap:4px}
.big.duo span{display:inline-block;animation:jump .8s ease-in-out infinite}
.big.duo span:nth-child(2){animation-delay:.4s}
.prop{animation:propspin .3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes propspin{50%{transform:scaleX(.15)}}
nav button span .owl{display:block}

nav.n5 button{font-size:11px}
nav.n5 button span{font-size:26px}
.cnt{position:absolute;top:8px;right:10px;font-family:'Lilita One';font-size:14px;background:var(--ink);color:#fff;border-radius:8px;padding:0 6px}
.tile.on .cnt{display:none}
.pips{display:flex;justify-content:center;gap:4px;margin-top:5px}
.pips i{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);background:#e3e6f7}
.pips i.on{background:var(--grass)}
.slotcap{font-size:14px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:0 6px;margin-left:4px;text-shadow:none}
.dot2{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font-family:'Lilita One';font-style:normal;font-size:16px;border:3px solid var(--ink);border-radius:12px;padding:0 8px;animation:pulse 1s infinite}
.who button{position:relative}
.livebox{background:#1b1b2f;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 #000;overflow:hidden;margin-top:6px}
.livehead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(90deg,#2b2350,#1b1b2f)}
.livehead .H{color:#fff;font-size:22px;flex:1}
.livepill{background:var(--red);color:#fff;font-family:'Lilita One';font-size:13px;border-radius:8px;padding:2px 8px;animation:pulse 1.2s infinite}
.viewers{display:flex}.viewers .owl{margin-left:-6px}
.feed{max-height:360px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(circle at 30% 0%,#3a2f6b,#1b1b2f 70%)}
.msg{display:flex;align-items:flex-end;gap:6px;animation:zoom .35s cubic-bezier(.3,1.7,.5,1)}
.msg.me{flex-direction:row-reverse}
.bub{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;max-width:76%;box-shadow:0 3px 0 #000}
.msg.me .bub{background:#fff3c4}
.msg.me .bub.sticker{background:transparent}
.bub .mt{display:block;font-size:11px;color:var(--muted);font-weight:700}
.bub.sticker{background:transparent;border:0;box-shadow:none;padding:0}
.bub.sticker .mt{color:#c9cbe6}
.stk{display:flex;flex-direction:column;align-items:center;animation:wiggle 2s ease-in-out infinite}
.stk b{font-family:'Lilita One';font-size:16px;color:var(--gold);-webkit-text-stroke:1.5px var(--ink);letter-spacing:.5px}
.txt{font-weight:600;font-size:15px}
.voice{display:flex;align-items:center;gap:8px;background:var(--pink);border:2px solid var(--ink);border-radius:12px;padding:4px 10px;color:#fff;font-family:'Lilita One';font-size:16px;cursor:pointer}
.wave{display:flex;align-items:center;gap:2px;height:22px}
.wave i{width:3px;background:#fff;border-radius:2px;height:30%}
.wave i:nth-child(3n){height:80%}.wave i:nth-child(3n+1){height:55%}
.voice.play .wave i{animation:wv .5s ease-in-out infinite alternate}
.voice.play .wave i:nth-child(2n){animation-delay:.2s}
@keyframes wv{from{transform:scaleY(.3)}to{transform:scaleY(1.2)}}
.bub.gift{background:linear-gradient(135deg,#fff3c4,#ffd6ec)}
.giftb{display:flex;align-items:center;gap:8px}
.giftb b{font-family:'Lilita One';display:block;font-size:16px;font-weight:400}
.giftb small{font-weight:600;font-size:13px}
.compose{padding:10px;background:#262645;border-top:3px solid var(--ink)}
.compose .seg{font-size:13px}
.stkrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stkrow button{background:#33335a;border:2px solid #4a4a7a;border-radius:14px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.stkrow button:active{transform:scale(.9)}
.stkrow b{font-family:'Lilita One';font-weight:400;font-size:11px;color:#fff}
.msgrow{display:flex;gap:6px;align-items:center;margin-top:10px}
.msgrow input{margin:0;flex:1}
.btn.pinkb{background:var(--pink);box-shadow:inset 0 -6px 0 var(--pinkD),0 5px 0 var(--ink);padding:5px 8px}
.kidnote{color:#c9cbe6;font-weight:600;text-align:center;margin-top:8px;font-size:13px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons button{border:3px solid var(--ink);border-radius:12px;background:#fff;font-family:'Fredoka';font-weight:700;font-size:13px;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.reasons button.on{background:#ffd6ec}
.rise{position:fixed;bottom:90px;z-index:45;pointer-events:none;animation:rise ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-70vh) scale(1.1);opacity:0}}
.editor{width:92%!important;max-width:400px!important;max-height:88vh;overflow-y:auto;text-align:left!important}
.editor .icpick{grid-template-columns:repeat(5,1fr)}
.erow{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.hrow{cursor:pointer}
.hbtns{display:flex;flex-direction:column;gap:6px}
.sw.help{font-family:'Lilita One';font-size:18px;background:var(--gold)}
.tutbg{background:rgba(27,27,47,.85)!important}
.tut{position:relative;width:90%;max-width:370px;background:var(--cream,#fff7e8);background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:18px;text-align:center;animation:zoom .35s cubic-bezier(.3,1.7,.5,1)}
.tut.kid{background:linear-gradient(180deg,#e6f6ff,#fff)}
.tut.parent{background:linear-gradient(180deg,#f3ecff,#fff)}
.tskip{position:absolute;top:10px;right:12px;border:0;background:none;font-family:'Fredoka';font-weight:700;color:var(--muted);cursor:pointer}
.tart{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin:6px 0}
.tart .mock{width:160px;cursor:default}
.ttl{font-size:30px;line-height:1.05;color:var(--ink)}
.tut.kid .ttl{color:var(--gold);-webkit-text-stroke:2px var(--ink);font-size:34px}
.tdesc{font-weight:600;font-size:17px;margin:8px 0 12px;min-height:48px}
.tut.parent .tdesc{font-size:15px}
.tdots{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.tdots i{width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);background:#fff}
.tdots i.on{background:var(--gold);width:26px}
.hrow .tag{font-size:12px}

header{padding-top:calc(16px + env(safe-area-inset-top))}
.code{font-size:26px;letter-spacing:1px;white-space:nowrap;background:#fff3c4;border:3px solid var(--ink);border-radius:14px;padding:8px;margin:8px 0;user-select:all}

.xseg{background:#c9ffd9}.xseg.on{background:#ff5a5a;color:#fff}
.item.xitem{background:linear-gradient(180deg,#fff,#ffecec)}.item.xitem.wear{background:#c9ffd9}
.snowbg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.snowbg i,.snowbox i{position:absolute;top:-10px;width:8px;height:8px;background:#fff;border-radius:2px;opacity:.85;animation:snow linear infinite}
.snowbox{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:16px}
.studio{position:relative}
@keyframes snow{to{transform:translateY(110vh) rotate(180deg)}}
.who,.logo{position:relative;z-index:1}
</style>
</head>

  if(weekKey(S.day)!==weekKey(t))S.missions.forEach(m=>{if(m.runs>1){m.runsDone=0;if(m.status==='done'||m.status==='todo'){m.status='open';m.owner=null;if(m.type==='duo'){m.joined={};m.parts={}}}}});

  S.live=S.live.slice(-120);
 }
 S.day=t;return true;
}

function chartLabels(){if(S.chartMode==='month')return['3w ago','2w ago','Last wk','This wk'];const d=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],t=new Date().getDay(),o=[];for(let i=6;i>=0;i--)o.push(i===0?'Today':d[(t-i+7)%7]);return o}

 const labels=chartLabels(),W=340,H2=200,L=34,R=28,T=18,B=34,n=labels.length;

 let g='';for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#d9dcef" stroke-width="2" stroke-dasharray="${i?'5 5':''}"/><text x="${L-6}" y="${yy+4}" text-anchor="end" class="ax">${Math.round(v)}${isPct?'%':''}</text>`}
 labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${H2-10}" text-anchor="middle" class="ax">${l}</text>`);
 series.forEach((s,si)=>{const pts=s.vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="${K}" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" class="draw"/><polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" class="draw"/>`;
  s.vals.forEach((v,i)=>g+=`<rect x="${x(i)-6}" y="${y(v)-6}" width="12" height="12" rx="3" fill="${s.c}" stroke="${K}" stroke-width="2.5" class="pt" style="animation-delay:${.6+i*.05}s"/>`);
  const lv=s.vals[n-1],by=si?y(lv)+12:y(lv)-34;g+=`<g class="pt" style="animation-delay:1s"><rect x="${x(n-1)-22}" y="${by}" width="34" height="22" rx="6" fill="${s.c}" stroke="${K}" stroke-width="2.5"/><text x="${x(n-1)-5}" y="${by+16}" text-anchor="middle" class="lv">${lv}${isPct?'%':''}</text></g>`});
 return `<svg viewBox="0 0 ${W} ${H2}" width="100%" class="chart">${g}</svg>`;
}

/* voice notes */
let REC=null;
async function startRec(){
 if(!navigator.mediaDevices||!window.MediaRecorder){toast('Voice notes not supported on this phone');return}
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('🎙 Please allow the microphone');return}
 const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/aac'];const mime=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
 const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});const chunks=[];const t0=Date.now();
 mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(REC.iv);const dur=Math.max(1,Math.round((Date.now()-t0)/1000));$('modal').innerHTML='';
  if(REC.cancel){REC=null;return}REC=null;
  const blob=new Blob(chunks,{type:mr.mimeType||mime||'audio/mp4'});if(blob.size>700000){toast('Too long, try again');return}
  const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
  toast('Sending…');const vid=uid();
  try{await DB.putVoice(S.fid,vid,{data,mime:blob.type,dur});const m={id:uid(),from:S.user,to:S.liveTo,kind:'voice',vid,dur,ts:Date.now(),seen:[]};S._shown.add(m.id);await act(()=>S.live.push(clone(m)));beep(SND.pop);burst('heart',10)}
  catch(e){console.error(e);toast('⚠️ Voice not sent')}};
 REC={mr,iv:null,cancel:false};mr.start();
 $('modal').innerHTML=`<div class="modal"><div class="blk" style="padding:22px;text-align:center"><div class="bounce">${I('mic',90)}</div><div class="H" style="font-size:26px">Recording…</div><div class="H" id="rect" style="font-size:40px;color:var(--pink)">0:00</div><p style="font-weight:600">Max 10 seconds · To: ${S.liveTo==='both'?'Both':S.kids[S.liveTo].name}</p>
 <div style="display:flex;gap:10px;margin-top:12px"><button class="btn grey" onclick="REC.cancel=true;REC.mr.stop()">Cancel</button><button class="btn" style="flex:1" onclick="REC.mr.stop()">SEND ✓</button></div></div></div>`;
 REC.iv=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);const e=$('rect');if(e)e.textContent='0:'+String(s).padStart(2,'0');if(s>=10&&mr.state==='recording')mr.stop()},250);
}
const VCACHE={};
async function playVoice(b,vid){
 b.classList.add('play');
 try{let v=VCACHE[vid];if(!v){v=await DB.getVoice(S.fid,vid);VCACHE[vid]=v}if(!v)throw 0;const a=new Audio(v.data);a.onended=()=>b.classList.remove('play');await a.play()}
 catch(e){b.classList.remove('play');toast('Could not play')}
}

async function hashPin(who,pin){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(S.fid+':'+who+':'+pin));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function askPin(who){S.pin='';S._who=who;S._pinMode=S.pins[who]?'enter':'new';S._pin1=null;drawPin()}
function drawPin(){
 const kid=!!S.kids[S._who],nm=P(S._who).name;
 const t=S._pinMode==='enter'?(kid?`Hi ${nm}! Secret code?`:`${nm} PIN`):S._pinMode==='new'?(kid?`${nm}, make a secret code!`:`Set ${nm}'s PIN`):'Type it again';
 $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="blk" id="pinbox"><div>${AV(S._who,80)}</div><div class="H" style="font-size:24px">${t}</div>
 ${S._pinMode!=='enter'?`<p style="font-weight:600;font-size:13px">${kid?'4 numbers. Keep it secret from your brother! 🤫':'4 numbers only you know (not the boys!)'}</p>`:(kid?'<p style="font-weight:600;font-size:13px">Forgot? Ask Papa or Mama to reset it.</p>':'')}
 <div class="pin">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?'f':''}"></i>`).join('')}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>n===''?'<span></span>':`<button onclick="pinKey('${n}')">${n}</button>`).join('')}</div></div></div>`;
}
async function pinKey(n){beep([[800,.05]]);if(n==='⌫')S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=n;
 if(S.pin.length===4){const who=S._who,pin=S.pin;S.pin='';
  if(S._pinMode==='enter'){const h=await hashPin(who,pin);if(h===S.pins[who]){enterUser(who)}else{drawPin();$('pinbox').classList.add('shake');beep(SND.no);toast('Wrong PIN')}return}
  if(S._pinMode==='new'){S._pin1=pin;S._pinMode='confirm';drawPin();return}
  if(S._pinMode==='confirm'){if(pin!==S._pin1){S._pinMode='new';drawPin();beep(SND.no);toast("Didn't match, try again");return}const h=await hashPin(who,pin);await act(()=>{S.pins[who]=h});toast('Code set ✓');if(S.user===who&&isParent()){closeModal();return}enterUser(who);return}
 }drawPin()}
function enterUser(who){if(S.kids[who])return enterKid(who);enterParent(who)}
function enterParent(who){closeModal();S.user=who;S.tab='check';LS.set('hoo_user',who);render();S._lastPC=checkCount(false);if(!S.seenTut[who])setTimeout(()=>showTut('parent'),200)}
function closeModal(){$('modal').innerHTML='';S.editing=null}

/* ---------- PARENT ---------- */
function checkCount(withNight=true){return S.missions.filter(m=>m.status==='pending').length+S.redeems.filter(r=>r.status==='pending').length+S.suggestions.filter(s=>s.p===null).length+S.ideas.length+(withNight&&nightNow()?(S.throne.checkedToday?0:1)+KIDS.filter(k=>S.shirt[k]===null).length:0)}
function parentView(){
 if(S.tab==='live'){const un=S.live.filter(m=>m.to==='parents'&&!(m.seen||[]).includes(S.user));if(un.length&&!S._markP){S._markP=true;const me=S.user;un.forEach(m=>S._shown.add(m.id));setTimeout(()=>act(()=>S.live.forEach(m=>{if(m.to==='parents'){m.seen=m.seen||[];if(!m.seen.includes(me))m.seen.push(me)}})).finally(()=>S._markP=false),500)}}
 const pc=checkCount(),me=P(S.user),kreply=S.live.filter(m=>m.to==='parents'&&!(m.seen||[]).includes(S.user)).length;
 const tabs=[['check','check','Check',pc],['plan','board','Plan'],['live','live','Live',S.tab==='live'?0:kreply],['stats','chart','Stats']];
 const body={check:pCheck,plan:pPlan,live:liveView,stats:pStats}[S.tab]();
 return `<header><div class="blk top"><div class="bounce">${AV(S.user,72)}</div><div class="nm"><div class="H">${me.name}</div><span class="badge">Parent</span></div><div class="hbtns"><button class="sw help" onclick="showTut('parent')">?</button><button class="sw" onclick="logout()">🔄</button></div></div></header>
 <main>${body}</main>
 <nav>${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="beep(SND.tick);S.tab='${t[0]}';render()"><span>${I(t[1],38)}</span>${t[2]}${t[3]?`<i class="dot">${t[3]}</i>`:''}</button>`).join('')}</nav>`;
}
function nightBlock(){
 return `<div class="banner" style="background:var(--purple)">${I('moon',30)} Tonight's check ${nightNow()?'':'<small style="font-size:12px">(jumps to top after 7pm)</small>'}</div>
 <div class="blk mis" style="flex-wrap:wrap"><div class="em">${I('toilet')}</div><div class="tx"><span class="H">Toilet clean?</span><small>Flushed + floor dry · team streak ${S.throne.streak}</small></div>
 ${S.throne.checkedToday?`<span class="tag ok">✅ Done</span>`:`<div style="display:flex;gap:8px"><button class="btn sm" onclick="throne(1)">👑 YES</button><button class="btn sm red" onclick="throne(0)">NO</button></div>`}</div>
 ${KIDS.map(k=>`<div class="blk mis"><div>${AV(k,56)}</div><div class="tx"><span class="H">${S.kids[k].name}'s shirt?</span><small>Clean = +2 ${Fs}</small></div>
 ${S.shirt[k]===null?`<div style="display:flex;flex-direction:column;gap:8px"><button class="btn sm" onclick="shirt('${k}',1)">🥷 Clean</button><button class="btn sm grey" onclick="shirt('${k}',0)">Messy</button></div>`:`<span class="tag ${S.shirt[k]?'ok':''}">${S.shirt[k]?'✅ Ninja!':'Tomorrow!'}</span>`}</div>`).join('')}`;
}
function pCheck(){
 const ms=S.missions.filter(m=>m.status==='pending'),rd=S.redeems.filter(r=>r.status==='pending'),sg=S.suggestions.filter(s=>s.p===null),cs=S.ideas;
 const main=`${ms.length?`<div class="banner">${I('swords',30)} Missions done</div>${ms.map(m=>{const duo=m.type==='duo';return `<div class="blk mis ${duo?'duo':''}"><div class="em">${I(m.ic)}</div><div class="tx">${duo?`<span class="dtag">${I('duo',16)} DUO</span>`:''}<span class="H">${esc(m.n)}</span>${duo?duoSlots(m):`<small>${S.kids[m.owner].name}</small> `}<span class="price">${F} ${m.price}${duo?' each + '+RBs:''}</span></div><div style="display:flex;flex-direction:column;gap:10px"><button class="btn sm" onclick="approve('${m.id}',1)">👍 OK</button><button class="btn sm grey" onclick="approve('${m.id}',0)">🔁 Redo</button></div></div>`}).join('')}`:''}
 ${rd.length?`<div class="banner" style="background:var(--pink)">${I('gift',30)} Rewards to give</div>${rd.map(r=>{const w=S.rewards.find(x=>x.id===r.rid)||{ic:'gift',n:'Reward'};return `<div class="blk mis"><div class="em">${I(w.ic)}</div><div class="tx"><span class="H">${esc(w.n)}</span><small>${S.kids[r.kid].name}</small></div><button class="btn gold sm" onclick="appRedeem('${r.id}')">GIVE 🎉</button></div>`}).join('')}`:''}
 ${cs.length?`<div class="banner" style="background:var(--grass)">${I('bulb',30)} Mission ideas from the boys</div>${cs.map(s=>`<div class="blk mis" style="flex-wrap:wrap"><div class="em">${I('bulb')}</div><div class="tx"><span class="H">${esc(s.n)}</span><small>From ${S.kids[s.kid].name}</small></div><div class="stepper"><button onclick="ideaAsk('${s.id}',-1)">−</button><b>${F}${s.ask}</b><button onclick="ideaAsk('${s.id}',1)">+</button></div><div style="width:100%;display:flex;gap:8px;margin-top:10px"><button class="btn sm blue" style="flex:1" onclick="ideaAdd('${s.id}','solo')">+ SOLO</button><button class="btn sm gold" style="flex:1" onclick="ideaAdd('${s.id}','duo')">+ DUO</button><button class="btn sm grey" onclick="ideaDel('${s.id}')">✕</button></div></div>`).join('')}`:''}
 ${sg.length?`<div class="banner" style="background:var(--purple)">${I('sparkle',30)} Reward wishes</div>${sg.map(s=>`<div class="blk mis" style="flex-wrap:wrap"><div class="em">${I('sparkle')}</div><div class="tx"><span class="H">${esc(s.n)}</span><small>From ${S.kids[s.kid].name}</small></div><div class="stepper"><button onclick="S['_p'+'${s.id}']=Math.max(10,(S['_p'+'${s.id}']||50)-10);render()">−</button><b>${F}${S['_p'+s.id]||50}</b><button onclick="S['_p'+'${s.id}']=(S['_p'+'${s.id}']||50)+10;render()">+</button></div><div style="width:100%;display:flex;gap:8px;margin-top:10px"><button class="btn sm" style="flex:1" onclick="sgAdd('${s.id}')">ADD TO SHOP ✓</button><button class="btn sm grey" onclick="sgDel('${s.id}')">✕</button></div></div>`).join('')}`:''}`;
 const empty=!ms.length&&!rd.length&&!sg.length&&!cs.length?`<div class="tip">✨ No approvals waiting.</div>`:'';
 return nightNow()?nightBlock()+main+empty:main+empty+nightBlock();
}
function approve(id,ok){const m=M(id);if(!m)return;
 if(!ok){act(()=>{const mm=M(id);if(!mm)return;if(mm.type==='duo'){mm.status='active';mm.parts={};KIDS.forEach(k=>ev(k,{kind:'redo',sub:mm.n}))}else{mm.status='todo';ev(mm.owner,{kind:'redo',sub:mm.n})}});beep(SND.no);toast('🔁 Sent back. They\'ll see it');return}
 if(m.type==='duo'){act(()=>{const mm=M(id);if(!mm||mm.status!=='pending')return;mm.status='done';mm.doneDay=todayStr();KIDS.forEach(k=>{addXP(k,mm.price+2);S.kids[k].rainbow++;ev(k,{kind:'duo',sub:mm.n,gain:mm.price+2})});if(mm.runs>1){mm.runsDone=(mm.runsDone||0)+1;if(mm.runsDone<mm.runs){mm.status='active';mm.parts={}}}});celebrate({duo:true,title:'DUO POWER!',sub:esc(m.n),gain:`+${m.price+2} ${F} + 1 ${RB} each`,btn:'HIGH FIVE!'});return}
 act(()=>{const mm=M(id);if(!mm||mm.status!=='pending')return;if(mm.runs>1){mm.runsDone=(mm.runsDone||0)+1;mm.status=mm.runsDone>=mm.runs?'done':'todo'}else mm.status='done';mm.doneDay=todayStr();addXP(mm.owner,mm.price);ev(mm.owner,{kind:'approve',sub:mm.n,gain:mm.price})});
 celebrate({who:m.owner,title:rnd(HYPE),sub:`${S.kids[m.owner].name}: ${esc(m.n)}`,gain:`+${m.price} ${F}`});
}
function appRedeem(id){act(()=>{const r=S.redeems.find(x=>x.id===id);if(!r)return;r.status='given';const w=S.rewards.find(x=>x.id===r.rid);ev(r.kid,{kind:'given',sub:w?w.n:'Your reward'});S.redeems=S.redeems.filter(x=>x.status==='pending')});celebrate({icon:'trophy',title:'GIVEN!',sub:'Enjoy, little owl!'})}
function sgAdd(id){const p=S['_p'+id]||50;act(()=>{const s=S.suggestions.find(x=>x.id===id);if(!s)return;S.rewards.push({id:uid(),ic:'sparkle',n:s.n,p});S.suggestions=S.suggestions.filter(x=>x.id!==id)});toast('Added to the shop 🎁')}
function sgDel(id){act(()=>{S.suggestions=S.suggestions.filter(x=>x.id!==id)})}
function ideaAsk(id,d){act(()=>{const s=S.ideas.find(x=>x.id===id);if(s)s.ask=Math.max(1,s.ask+d)})}
function ideaDel(id){act(()=>{S.ideas=S.ideas.filter(x=>x.id!==id)})}
function ideaAdd(id,type){act(()=>{const s=S.ideas.find(x=>x.id===id);if(!s)return;S.ideas=S.ideas.filter(x=>x.id!==id);S.missions.push(type==='duo'?{id:uid(),type:'duo',ic:'broom',n:s.n,price:s.ask,joined:{},parts:{},status:'open'}:{id:uid(),type:'solo',ic:'broom',n:s.n,price:s.ask,owner:null,status:'open'})});toast('Posted to the board!')}
function throne(ok){act(()=>{if(S.throne.checkedToday)return;S.throne.checkedToday=true;if(ok){S.throne.streak++;KIDS.forEach(k=>{addXP(k,3);ev(k,{kind:'throne'})})}else S.throne.streak=0});if(ok)celebrate({icon:'crown',title:'CLEAN THRONE!',sub:`${S.throne.streak} nights in a row!`,gain:`+3 ${F} each`});else{beep(SND.no);toast('Streak reset. Tomorrow! 💪')}}
function shirt(k,ok){act(()=>{if(S.shirt[k]!==null)return;S.shirt[k]=!!ok;if(ok){addXP(k,2);ev(k,{kind:'ninja'})}});if(ok){beep(SND.tick);toast(`🥷 ${S.kids[k].name} +2 ${Fs}`)}}

 ${changed?`<div class="tip" style="background:#e9ecff">🌅 <b>Changes start tomorrow</b> so today stays fair.<div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm grey" onclick="undoDraft('${k}')">Undo changes</button><button class="btn sm blue" onclick="applyNow('${k}')">Start now instead</button></div></div>`:''}

 const base={id,ic:p.ic,n,price:p.price,status:'open'};if(p.runs>1){base.runs=p.runs;base.runsDone=0}
 act(()=>S.missions.unshift(p.type==='duo'?Object.assign({type:'duo',tip,joined:{},parts:{}},base):Object.assign({type:'solo',owner:null},base)));
 celebrate({icon:p.type==='duo'?'duo':p.ic,title:'POSTED!',sub:`"${esc(n)}" is on the board`,btn:'NICE!'})}

 <div class="erow"><b>Price:</b><div class="stepper"><button onclick="S._rp=Math.max(5,(S._rp||30)-5);keep('rn')">−</button><b>${F}${S._rp||30}</b><button onclick="S._rp=(S._rp||30)+5;keep('rn')">+</button></div></div>

function rwP(id,d){act(()=>{const r=S.rewards.find(x=>x.id===id);if(r)r.p=Math.max(5,r.p+d)})}
function rwDel(id){act(()=>{S.rewards=S.rewards.filter(x=>x.id!==id)})}
function addReward(){const n=$('rn').value.trim();if(!n){$('rn').classList.add('shake');beep(SND.no);return}const ic=S._ric,p=S._rp||30;act(()=>S.rewards.push({id:uid(),ic,n,p}));toast(`"${esc(n)}" added 🎁`)}

function showTut(role){S.tut={role,i:0};drawTut()}
function drawTut(){
 const T=S.tut,L=T.role==='kid'?TUT_K:TUT_P,sl=L[T.i],last=T.i===L.length-1;
 $('modal').innerHTML=`<div class="modal tutbg"><div class="tut ${T.role}" id="tutc">
 <button class="tskip" onclick="endTut()">Skip ✕</button>
 <div class="tag" style="display:inline-block;margin-bottom:4px">${T.role==='kid'?'HOW TO PLAY':'PARENT GUIDE'} · ${T.i+1}/${L.length}</div>

 <div class="H ttl">${sl.t}</div><p class="tdesc">${sl.d}</p>
 <div class="tdots">${L.map((_,i)=>`<i class="${i===T.i?'on':''}"></i>`).join('')}</div>
 <div style="display:flex;gap:10px">${T.i?`<button class="btn grey" onclick="tutGo(-1)">BACK</button>`:''}<button class="btn ${last?'gold':''}" style="flex:1" onclick="${last?'endTut()':'tutGo(1)'}">${last?(T.role==='kid'?"LET'S PLAY!":'GOT IT!'):'NEXT →'}</button></div>
 </div></div>`;
 const c=$('tutc');let x0=null;c.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});c.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)tutGo(dx<0?1:-1);x0=null});
}
function tutGo(d){const L=S.tut.role==='kid'?TUT_K:TUT_P,n=S.tut.i+d;if(n<0||n>=L.length)return;S.tut.i=n;beep(SND.tick);drawTut()}
function endTut(){$('modal').innerHTML='';S.tut=null;if(S.user&&S.fid&&!S.seenTut[S.user]){const u=S.user;act(()=>{S.seenTut[u]=true})}beep(SND.win);const f=S._afterTut;S._afterTut=null;if(f)f()}



/* ---------- demo store (?demo) for testing without Firebase ---------- */
function mockDB(){
 const key=id=>'hoo_demo_'+id,subs={};
 const read=id=>{try{return JSON.parse(localStorage.getItem(key(id)))}catch(e){return null}};
 const write=(id,d)=>{localStorage.setItem(key(id),JSON.stringify(d));(subs[id]||[]).forEach(cb=>setTimeout(()=>cb(clone(d)),30))};
 window.addEventListener('storage',e=>{Object.keys(subs).forEach(id=>{if(e.key===key(id)){const d=read(id);if(d)subs[id].forEach(cb=>cb(d))}})});
 return{get:async id=>read(id),create:async(id,d)=>write(id,d),tx:async(id,fn)=>{const d=read(id);if(!d)throw new Error('gone');write(id,fn(clone(d)))},
  listen:(id,cb)=>{(subs[id]=subs[id]||[]).push(cb)},putVoice:async(id,vid,d)=>localStorage.setItem('hoo_v_'+vid,JSON.stringify(d)),getVoice:async(id,vid)=>JSON.parse(localStorage.getItem('hoo_v_'+vid)||'null')};
}
async function boot(){
 const fid=LS.get('hoo_fid');
 if(fid){try{const d=await DB.get(fid);if(d){S.fid=fid;unpack(d);DB.listen(fid,onRemote);const u=LS.get('hoo_user');if(u&&(S.kids[u]||S.parents[u])){S.user=u;S.tab=(u==='dad'||u==='mum')?'check':'today'}}else LS.set('hoo_fid',null)}catch(e){console.error(e);toast('⚠️ Could not load. Check internet')}}
 S.ready=true;render();
 if(S.fid&&S.day!==todayStr())act(()=>{});
 if(S.fid)xmasGift();
 if(S.user){S._lastPC=checkCount(false);remoteFx()}
 setInterval(()=>{if(S.fid&&S.day!==todayStr()&&!BUSY)act(()=>{})},60000);
}
function xmasGift(){if(S.flags&&S.flags.xmas26)return;act(()=>{S.flags=S.flags||{};if(S.flags.xmas26)return;S.flags.xmas26=true;KIDS.forEach(k=>{S.kids[k].rainbow+=30;S.live.push({id:uid(),from:'mum',to:k,kind:'gift',gift:{amt:30,cur:'r',reason:'🎄 Christmas gift! Go to Me → Owl Studio and dress up your owl'},ts:Date.now(),seen:[]})})})}
function bootFail(msg){S.ready=true;$('app').innerHTML=`<div class="logo" style="padding-top:calc(100px + env(safe-area-inset-top))"><div class="H">HOO<br>DID IT?</div><p>${msg}</p><button class="btn" style="margin-top:20px" onclick="location.reload()">TRY AGAIN</button></div>`}

render();
</script>

  import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
  import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')]);
 const firebaseConfig={

  authDomain:"hoo-did-it.firebaseapp.com",
  projectId:"hoo-did-it",
  storageBucket:"hoo-did-it.firebasestorage.app",
  messagingSenderId:"507015741803",
  appId:"1:507015741803:web:b5c5cc9306b40544150c2e"
 };
 const app=initializeApp(firebaseConfig);const auth=getAuth(app);
 let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache()})}catch(e){db=initializeFirestore(app,{})}
 const fam=id=>doc(db,'families',id);
 window.DB={

  putVoice:(id,vid,d)=>setDoc(doc(db,'families',id,'voice',vid),d),
  getVoice:async(id,vid)=>{const s=await getDoc(doc(db,'families',id,'voice',vid));return s.exists()?s.data():null}
 };

 onAuthStateChanged(auth,u=>{if(u&&!started){started=true;boot()}});
